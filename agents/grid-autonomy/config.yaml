# grid-autonomy daemon contract — portfolio, venues, providers, policy defaults.
# The daemon (Phase 4) reads this; all execution stays blocked until
# execution/guardrails.py passes every gate below.

# ══ CONFIG DERIVATION (audit 2026-09-06, loop-health §d / profit-ledger) ══
# Platform reality: WT caps demo (paper) grid bots at 5 (account-wide) and
# the binance free tier at 1 active grid bot — the old 9-slot plan left
# $200 of the $600 fund in phantom slots 4/6/8/9 (27+ idle slot-hours)
# while the top screener picks were cap/guard-vetoed. The portfolio is
# consolidated to the 5-bot reality: 4 hyperliquid slots + 1 binance slot
# (daemon-side reconcile_slots prunes cap-blocked EMPTY slots at restart;
# occupied slot ids never change).
#
# Sizing math (CORRECTED semantics — tiers are TARGET worst-case
# fractions of the slot): per_line = max(exchange $10/line floor, tier
# budget / side_lines), worst_case = per_line × side_lines ≈ one channel
# side; cap = min(autonomy tier, max_alloc_per_slot). The tier budget is
# divided over the SIDE lines only — the lines that can fill adversely:
#   • full tier, neutral risk-team mult 1.0: a $180 HL slot on an
#     11–12-line channel now reaches the DESIGNED $90 worst-case (50%
#     cap; ~$15/line over 6 side lines) — idle capital goes into fatter
#     positions instead of a half-empty ladder. Mult 0.7 → $63.
#   • base/probe stay floor-bound on 11–12-line channels (0.25/0.40 ×
#     $180 spread over 6 side lines < $10 → per-line floored at $10,
#     worst ≈ $60 ≤ $90).
#   • The guard-veto "cannot fund ≥5 lines at $10 within 50% worst-case
#     cap" fired 21× on CASHCAT-class tokens (24–31%/24h net harvest):
#     full-density grids there need 16–18 lines → side_lines 8–9 × $10
#     = $80–90 worst-case. At the old $100 slots the cap was $50 → veto.
#   → min_slot_usd 180: 0.5 × 180 = $90 worst-case cap admits 18 lines
#     × $10 (fit_grids = 2×90/10) with zero density loss, and even the
#     base tier (0.25 × 180 = $45 → per-line floored to $10) funds
#     worst ≈ $80 ≤ $90 without the density-first re-fit.
#   • Binance slot sized to GIGGLE's actual needs: 10–12 lines × $10 →
#     worst ≈ $50–60 → $120 slot = $60 cap covers full density.
#   • Total worst-case at full re-deploy: 4 × $90 (HL) + $60 (BN) = $420
#     ≤ deployable ceiling 600 × 0.85 = $510 ✓ (headroom $90 = one more
#     dynamic HL slot at the floor).
#   • Sleeves 480 + 120 = 600 = total_usd: for dynamic HL the
#     min_slot_usd floor dominates the sleeve split (480/4 = 120 < 180),
#     which is the documented dynamic-mode design — capital, not the
#     sleeve, is the binding constraint, enforced per-deploy by the
#     committed-vs-ceiling guardrail.
#   • NO guardrail weakened: max_alloc_per_slot stays 0.50 (hard worst-
#     case cap per slot), cash_buffer_pct stays 0.15, the 8 fail-closed
#     guardrail checks and the never-close-at-a-loss rule are untouched.
portfolio:
  total_usd: 600.0
  venues:
    hyperliquid: { balance_usd: 480.0, market: perps, grids: [Long, Short, Neutral] }
    binance:     { balance_usd: 120.0, market: spot,  grids: [Long, Neutral] }  # spot-like sleeve: NO Short (kept even on the futures paper stand-in)
  slots_min: 3
  slots_max: 5                  # slot-count ceiling for FIXED venues only
                                # (everything not in dynamic_slot_venues)
  slots_hard_max: 6             # operator ceiling: watch at most 6 TOTAL
                                # slots (5 hyperliquid + 1 binance at the
                                # current sleeves) — enforced both in
                                # open_slot AND by pruning empty slots above
                                # it at reconcile + health ticks. Capital is
                                # still the binding constraint: each new
                                # slot needs its $ worst-case in spare
                                # deployable capital anyway
  dynamic_slot_venues: [hyperliquid]
                                # DEFAULT DYNAMIC MODE: HL slots open as long
                                # as there is a profitable opportunity
                                # (score ≥ screen.open_slot_min_score) AND
                                # enough spare deployable capital. Capital is
                                # the ceiling, not a slot count.
  min_slot_usd: 180.0           # per-slot budget floor for dynamic opens —
                                # unlocks the $80–90 worst-case band the
                                # CASHCAT-class tokens need at the $10/line
                                # exchange floor (see derivation above)
  slots_default: 4
  max_alloc_per_slot: 0.5      # worst-case commitment ≤ 50% of slot
                                # (UNCHANGED — no guardrail weakened)
  cash_buffer_pct: 0.15        # portfolio deployable ceiling = 85% of 600
                                # (UNCHANGED): total worst-case 420 ≤ 510 ✓

screen:
  presets: [grid-neutral, grid-directional]
  interval: 1h
  confirm_interval: 4h         # direction must agree on 1h + 4h for trend grids
  limit: 300
  min_volume_usd: 2000000      # moderately significant: ≥ $2M 24h quote volume
  universe_max_symbols: 100    # scan breadth per venue (top-N by 24h volume) —
                               # the EV + tvcli passes pick winners, not a
                               # hand-curated list
  top_per_preset_venue: 30
  confluence_top: 10
  confluence_skills: [squeeze, choppiness, mtf-confluence, dvi, vp, sr-breaks]  # tvcli /hunt — `vp` is PUBLIC; `vp-pro` is a private script the deployment's TV account does not own (/hunt 400 private_skill)
  open_slot_min_score: 40.0    # new-venue-slot floor (see portfolio.slots_max)
  rescreen_minutes: 10         # daemon re-runs merge+swarm every 10m
                               # (each run also refreshes state.screen_cache —
                               # the optimizer's challenger board)

optimizer:                     # fast loop BETWEEN rescreens (optimizer.py)
  enabled: true
  interval_min: 3              # hunt cadence, clamped to 2–5 by the daemon
  idle_minutes: 5.0            # absolute no-fill floor before a slot is idle
  idle_k: 1.0                  # threshold = max(floor, k × expected interval)
                               # — "inactive" is relative to what the token
                               # promised (20 fills/day needs ~72 min, not 5)
  min_hold_min: 20             # fast churn guard (rescreen's 24h floor does
                               # NOT apply here — that is the point)
  upgrade_margin: 8.0          # challenger must beat incumbent Δscore ≥ 8 …
  arbiter_margin: 5.0          # … or ≥ 5 with the LLM arbiter's backing
  arbiter_min_confidence: 0.7
  min_swap_interval_min: 30    # per-slot swap rate limit
  max_swaps_per_hour: 3        # successful-swap churn cap (global)
  max_attempts_per_hour: 6     # attempt cap (guard-vetoed tries included)
  max_attempts_per_slot: 2     # challengers tried per idle slot per cycle
                               # (a sizing/reliability veto on the top pick
                               # falls through to the next-best challenger
                               # in the SAME cycle — adaptation, not churn)
  fail_cooldown_min: 60         # failed swap attempt cools THAT challenger
                               # (the slot stays free for the next-best one)
  hunt_top: 8                  # challengers refreshed per cycle
  hunt_skills: [squeeze, choppiness]   # tvcli /hunt on the FAST tape —
  hunt_timeframe: 15m          # the rescreen's 1H pass never sees these bars
  hunt_bars: 96
  refresh_limit: 180           # 1h candles per refresh (light vs merge's 300)
  screen_cache_fresh_min: 120  # older candidate board → wait for rescreen
  refill_nudge_min: 10         # empty-slot rescreen-nudge rate limit
  run_card_every_n_cycles: 40  # heartbeat run card cadence for QUIET cycles
                               # (~2h at 3-min cycles); interesting cycles
                               # (idle/arbiter/swap/veto/refill) always card
  llm_provider: mistral        # arbiter pinned to Mistral (the debate chain
                               # stays on CF) — falls back to the global
                               # chain when MISTRAL_API_KEY is absent

grid_defaults:                 # passed through to grid_config.py
  band_atr: 3.0
  step_factor: 0.5
  step_min: 0.1
  step_max: 2.0
  min_grids: 5
  max_grids: 30
  dca_factor: 1.5
  stop_trigger: "stop_and_close_all"
  pump_protection: true
  # daemon-side profit exit: when a bot's cumulative total PnL (realized
  # round-trips + mark PnL of open lines) reaches this fraction of its slot
  # budget AND every open line is at >= 0, the bot is stopped at profit and
  # the slot recycled. WT's native takeProfit field is accepted but NOT
  # enforced server-side for grid bots yet — the daemon owns the exit.
  # 0 disables. Never closes a losing line (see the loss-veto rule).
  # 0.10 × $100 slot = $10/bot was never reached (max cumulative PnL in
  # 11.5 h: $0.58 — ~50 days to target, zero profit-exits ever fired);
  # 0.04 × $180 = $7.2 recycles a winning bot in ~15–20 days at current
  # fill rates while keeping the all-lines-≥0 refinement (audit §d).
  take_profit_pct: 0.04

llm:
  chain: [cf, mistral, openrouter]   # GRID_LLM_CHAIN env/sidecar
                                # overrides; the daemon now exports this as
                                # the env DEFAULT at boot (was dead config).
                                # NVIDIA dropped 2026-09-07 (the free model
                                # returns HTTP 410); CF strips itself when
                                # creds are missing in provider._has_creds.
  cf_model: "@cf/zai-org/glm-5.3"
  openrouter_model: "arcee-ai/trinity-large-preview:free"
  mistral_model: "mistral-large-latest"
  brief_interval_min: 30       # always-on intelligence lane: one LLM market
                               # brief per interval over the fresh screen +
                               # fleet evidence (journaled `market-brief`,
                               # shown in the console Fleet rail). Keeps the
                               # Mistral subscription working even when the
                               # deploy machinery is idle (demo cap / full
                               # fleet → the debate swarm never fires).
                               # 0 disables. ADVISORY ONLY — never gates.
  brief_provider: mistral       # the brief lane is pinned to this provider
                               # (falls back to the global chain when its
                               # key is absent — e.g. local dry-runs)
  max_calls_per_decision: 8

policy:                        # history-derived per token; values here are bounds
  cooldown_min_h: 12.0
  cooldown_max_h: 72.0
  fill_ratio_stagnant: 0.3
  realized_ratio_stagnant: 0.4
  score_drop_rotate: 12.0
  hysteresis_score: 5.0
  min_hold_h: 24               # rotation cooldown floor even if policy says less

reliability:                   # Phase G gates before any live scale-up
  paper_profile: demo-hype     # hyperliquid paperTrading profile
  min_samples: 30
  profit_factor_pass: 1.3
  profit_factor_kill: 1.0
  kill_min_samples: 10         # recent_pf<1.0 kill-flag binds only with ≥ this
                               # many closed trips — one losing round-trip on a
                               # fresh archetype must not ban the regime forever

watch:                         # daemon health-poll loop (Phase 4)
  interval_s: 60               # observe_all poll cadence
  adjust_steps_threshold: 2.0  # in-place adjust once price drifts >2 grid steps from mid
  adjust_cooldown_h: 2.0       # per-bot grid-edit rate limit (was hardcoded
                               # 6 h — audit: a Δ+205.75% recenter rec sat
                               # ~4 h behind the window). Shared window:
                               # manual recenters AND position-optimizer
                               # applies write the same last_adjust clock.
                               # Verified 2026-09-06 from journal evidence:
                               # WT applies NO server-side edit rate limit
                               # (successful same-bot edits observed 3.8 h
                               # and 4.2 h apart: GRAM 03:24→07:13→11:24Z)
                               # — this daemon-side window is the ONLY edit
                               # limiter. Failed edits are retried after a
                               # 10-min backoff, not treated as applied.
  pnl_snapshot_interval_s: 300 # fleet PnL journal cadence (0 = off)
  gone_warn_after: 3           # ticks a bot must be missing from a HEALTHY
                               # grid status list before the (once-per-episode)
                               # health-warn fires
  gone_clear_min: 30           # minutes of CONTINUOUS missing observations
                               # before the bot is dropped (journal `bot-gone`,
                               # slot freed). Transport errors ("browser/
                               # session down") never count — fail closed.
  browser_cdp: http://127.0.0.1:9222      # CloakBrowser CDP probe (WT session-API transport)
  browser_restart_cooldown_s: 600         # watchdog relaunch at most every 10 min
  # The WT cookie session lives in the minimal-mjs browser profile — relaunch
  # from THERE (a fresh browser-debug profile would be logged out).
  browser_launch_cmd: "node /Volumes/ExMac/code/tradingview/minimal-mjs/launch.mjs"
  wt_restore_cmd: "node /Volumes/ExMac/code/tradingview/go/browser-debug/wt.mjs"

autonomy:                      # escalation ladder + profile allowlists
  mode: auto                   # auto: manage loop runs unattended
  base_pct: 0.25               # unproven archetype: target 25% of slot worst-case
  probe_pct: 0.40              # ≥10 reliability samples → probe at 40%
  full_pct: 0.50               # ≥30 samples & PF≥1.3 → full 50%
  tier_max_grids:              # tiers ALSO cap grid density (line count), not
    base: 12                   # just the worst-case target — otherwise the
    probe: 20                  # $-per-line exchange floor pushed every tier to
    full: 30                   # the hard cap and base/probe/full were symbolic.
                               # Base deployments are genuinely small probes:
                               # fewer lines → wider step → less capital at
                               # risk until reliability samples accrue.
                               # NOTE (density-first sizing): tiers are TARGETS.
                               # The exchange minimum per line (limits.cost.min,
                               # e.g. 10 USDC on Hyperliquid) raises per-line
                               # funding to keep full grid density — using more
                               # funds instead of degrading the geometry — and
                               # the hard worst-case cap (min of full_pct and
                               # max_alloc_per_slot, applied to the ONE-SIDED
                               # adverse fill ≈ half the channel) always holds.
  live_profiles: []            # real-money profile NAMES; empty = real money ALWAYS refused
  paper_profiles:               # paperTrading=true profile NAMES per venue.
    hyperliquid: [demo-hype]   #   HYPERLIQUID_SWAP paper profile
    binance: [demo-bn]         #   BINANCE_FUTURES paper stand-in (WunderTrading has
                               #   NO Binance spot paper mode); pairCodes resolve from
                               #   the derivative map, no-Short rule still enforced.
                               #   Connect a real BINANCE (spot) account and list it in
                               #   live_profiles for the spot sleeve to go live.
                               # Missing paper profiles are SELF-HEALED: the daemon
                               # ensures they exist at boot (live-paper mode) and
                               # retries on the health cycle.
  profile_bootstrap_cooldown_s: 1800  # retry cadence between ensure attempts

memory:                        # reflect.py memory recall for swarm briefs
  k: 3                         # top-k past memories injected per candidate

adopt_existing: true           # first run: adopt matching active paper bots into free slots

guardrails:                    # ALL must pass or deployment is refused (fail-closed)
  checks:
    - pairCode_from_get_exchange_markets
    - profilesCodes_active_with_balance
    - worst_case_commitment_within_max_alloc
    - profit_per_grid_ge_2x_spread
    - venue_side_allowed        # binance spot rejects Short
    - reliability_gate
    - cooldown_and_hysteresis
  kill_file: agents/grid-autonomy/KILL   # presence halts the daemon

server:
  tvcli: http://127.0.0.1:8765
  daemon_port: 8799

heartbeat:                    # loop-health monitor + safe self-nudges
  enabled: true               # heartbeat_cycle every interval_s: 8 checks
                              # (tvcli /health, PocketBase, WT observe fold,
                              # screen-cache freshness, optimizer liveness,
                              # position-optimizer recency, journal error
                              # rate, pnl-snapshot feed) → 0–100 score in
                              # state.heartbeat + the console chip. Stale
                              # screen/optimizer feeds self-nudge
                              # (queue_rescreen / queue_optimize) when the
                              # daemon is NOT in dry-run.
  interval_s: 900             # one heartbeat per 15 min (first ~60s after
                              # startup)
  screen_stale_s: 2400       # screen_cache older than this → rescreen nudge
  error_rate_warn: 0.3       # journal -error fraction in the trailing hour
                              # above this → journal_errors check fails

position_optimizer:           # slow-loop position revaluation (position_optimizer.py)
                               # — ADVISORY by default: apply: false means recs are
                               # journaled/persisted but never auto-edit WunderTrading
  enabled: true
  interval_min: 15             # manage-loop cadence for cycle() (min 1)
  cooldown_min: 60            # per-bot re-analysis cooldown
  min_improvement_pct: 2.0    # journal/persist gate on expected_delta —
                               # AND the daemon-side apply gate
  apply: true                  # auto-edits when the gates allow:
                               # GEOMETRY recs (recenter/widen/narrow/
                               # resize/revalue-grid) via the existing
                               # grid-edit path (improvement gate, shared
                               # 2 h adjust rate limit, daily cap), and
                               # EXIT-ADD recs (add-take-profit/
                               # add-trailing/add-stop-loss) via the
                               # wtclient set_exits seam — the exit-only
                               # live edit of an ACTIVE bot (no stop/
                               # restart, verified 2026-09-07). Exit keys
                               # are still stripped from applied geometry
                               # payloads. false (the engine default)
                               # keeps EVERYTHING advisory — journal +
                               # PB records only, zero WT mutation.
  max_apply_per_day: 4        # daemon-side auto-edits per calendar day
  error_verbosity: full        # WT-error journal verbosity: 'full' carries
                               # status_code + first 200 chars of response
                               # text from wt_library._wun_error_envelope.
                               # 'compact' falls back to the old 120-char
                               # stdout head. 'full' is the default — the
                               # 2026-09-07 WT 500 was unreadable otherwise.
  stop_loss_enabled: false     # grids are mean-reversion: off by default
  take_profit_pct: 0.04        # × slot balance = USD profit-exit target
                               # (mirrors grid_defaults.take_profit_pct)
  trailing_activation_pct: 5.0   # cumulative PnL % of slot to arm trail
  trailing_execute_pct: 2.0      # give-back % that executes the trail
  positions_trailing: true       # per-position trailing preference
  band_atr: 3.0                # ATR multiples each side of price
  drift_steps: 2.0             # recenter after N × step_pct drift
  atr_change_pct: 15.0         # widen/narrow after N% channel-width change

carry_pray:                   # gap-report 2026-09-07: trader behavior
                               # "I believe in this token's intrinsic
                               # value or trend — keep the position,
                               # free the capital for something
                               # harvesting right now." When a bot's
                               # underwater book has been stuck longer
                               # than the token's natural profitable-
                               # close time (k × avg_holding_h from the
                               # stagnation_policy), the slot is freed
                               # and the bot is parked in
                               # state["carry_pray"] with a server-
                               # side takeProfit at break-even + buffer.
                               # On every health cycle the carry-pray
                               # bot is observed; when WT reports it
                               # stopped, the entry is dropped and the
                               # decision_id outcome is recorded.
  enabled: true
  carry_after_k: 1.5           # × avg_holding_h (mirrors cooldown math)
  min_carry_h: 0.5             # never carry a fresh bot within 30 min
  max_carry_h: 168.0           # never wait longer than 7 days for recovery
  auto_apply_tp: true          # place a server-side takeProfit on entry
  tp_break_even_buffer_usd: 0.5  # TP above break-even (covers fees)
