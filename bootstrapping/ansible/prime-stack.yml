---
# prime-stack.yml — orchestrator for the DSH prime-orchestrator stack in the
# tvcli devcontainer/codespace.
#
# ARCHITECTURE (v2): Ansible owns what it is good at — apt packages,
# orchestration, tags, preflight — and every install/config step is
# delegated to the modular, unit-tested python engine:
#
#     bootstrapping/python/prime_stack/        (importable library + stages)
#     bootstrapping/python/bin/prime-stack      (standalone runner, no ansible)
#
# Each playbook task below runs ONE engine stage and parses its JSON
# envelope (always the LAST stdout line; human logs go to stderr):
#
#     {"stage": ..., "changed": ..., "failed": ..., "summary_line": ...}
#
# Benefits over the v1 single-file playbook: the pnpm allowBuilds remedy,
# JSON keyed-merges, fleet marker semantics and the settings.yaml catalog
# are pure functions with unit tests (bootstrapping/python/tests/); the
# engine is reusable standalone (`prime-stack --dry-run all`); secrets
# never appear in task arguments (stages read them straight from the
# process env), so no_log is needed nowhere; `ansible-playbook --check`
# maps to engine dry-run and reports would-change faithfully.
#
# Run (inside the codespace, from the repo root):
#   ansible-playbook bootstrapping/ansible/prime-stack.yml \
#     -i localhost, -e ansible_connection=local \
#     -e ansible_python_interpreter=/usr/bin/python3 \
#     -e tv_workspace="$PWD"
#
# Knobs (unchanged from v1):
#   -e prime_stack_strict=true         missing CF secrets are fatal
#   -e prime_stack_force_settings=true  replace ~/.dsh/settings.yaml (after backup)
#
# Tags (unchanged from v1): dsh, plugin, preset, agent, env, dsh-config,
# prime-config, extras (plugins/mnemon/mobile/mcp), secrets, fleet, always.
#
# Contract (unchanged from v1):
#   - CLOUDFLARE_ACCOUNT_ID + CLOUDFLARE_API_KEY gate the config-writing
#     stages (skip + warn, fatal under strict). The account id is templated
#     at runtime from the env var; auth values never appear in logs.
#   - Idempotent: a second run does nothing; a half-installed state
#     self-heals.
#   - ansible-core 2.14 compatible (Debian bookworm ansible 7.7), builtin
#     modules only.

- name: Install and configure the DSH prime-orchestrator stack (codespace)
  hosts: all
  gather_facts: true

  vars:
    # --- knobs (override with -e) -------------------------------------------
    prime_stack_strict: false        # true: missing CF secrets are fatal
    prime_stack_force_settings: false # true: replace an existing ~/.dsh/settings.yaml (after backup)
    tv_workspace: "{{ playbook_dir | dirname | dirname }}" # repo root

    # --- engine location + shared stage environment ------------------------
    prime_py: "{{ playbook_dir | dirname }}/python"
    prime_stage_env:
      PYTHONPATH: "{{ prime_py }}"
      TV_WORKSPACE: "{{ tv_workspace }}"
      PRIME_STACK_STRICT: "{{ 'true' if prime_stack_strict | bool else 'false' }}"
      PRIME_STACK_FORCE_SETTINGS: "{{ 'true' if prime_stack_force_settings | bool else 'false' }}"
      # ansible --check maps to engine dry-run: stage tasks still execute
      # (check_mode: false) but perform no writes and run no installers.
      PRIME_STACK_DRY_RUN: "{{ 'true' if ansible_check_mode else 'false' }}"

    # --- preflight (visibility only; stages re-check) ------------------------
    cf_account_id: "{{ lookup('env', 'CLOUDFLARE_ACCOUNT_ID') }}"
    cf_api_key: "{{ lookup('env', 'CLOUDFLARE_API_KEY') }}"
    cf_secrets_present: "{{ (cf_account_id | length) > 0 and (cf_api_key | length) > 0 }}"

  tasks:
    # ---------------------------------------------------------------- preflight
    - name: Warn when Cloudflare secrets are missing (config stages will be skipped)
      ansible.builtin.debug:
        msg: >-
          [prime-stack] WARN: CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_KEY not set —
          dsh/prime-agent still install, but model-config stages are skipped.
          Set them as repo codespace secrets, then re-run this playbook.
      when: not (cf_secrets_present | bool)
      tags: [always]

    - name: Fail on missing Cloudflare secrets (prime_stack_strict=true)
      ansible.builtin.fail:
        msg: "prime_stack_strict=true but CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_KEY are not set"
      when:
        - prime_stack_strict | bool
        - not (cf_secrets_present | bool)
      tags: [always]

    # ------------------------------------------------------------------ packages
    # Ansible owns the apt stage: declarative, idempotent package installs the
    # engine stages depend on (python3-yaml for fleet-patch, curl for the
    # prime-agent installer, setsid from util-linux, jq for bw-provision).
    - name: Ensure runtime packages for the prime-stack engine
      become: true
      ansible.builtin.apt:
        name:
          - python3-yaml
          - curl
          - jq
          - util-linux
        state: present
        install_recommends: false
        cache_valid_time: 3600
      tags: [packages, always]

    # ------------------------------------------------------------------ dsh
    - name: "stage: dsh — install the dsh CLI (exact 0.1.1-rc.2) + pnpm >= 10"
      ansible.builtin.command:
        cmd: python3 -m prime_stack dsh
      environment: "{{ prime_stage_env }}"
      register: r_dsh
      changed_when: r_dsh.stdout_lines and (r_dsh.stdout_lines | last | from_json).changed | default(false)
      check_mode: false
      tags: [dsh]

    # ------------------------------------------------------------------ plugin
    - name: "stage: plugin — dsh-prime-orchestrator into profile web (pnpm-11 allowBuilds remedy)"
      ansible.builtin.command:
        cmd: python3 -m prime_stack plugin
      environment: "{{ prime_stage_env }}"
      register: r_plugin
      changed_when: r_plugin.stdout_lines and (r_plugin.stdout_lines | last | from_json).changed | default(false)
      check_mode: false
      tags: [plugin]

    # ------------------------------------------------------------------ agent
    - name: "stage: agent — prime-agent CLI (official installer, pty-hang safe)"
      ansible.builtin.command:
        cmd: python3 -m prime_stack agent
      environment: "{{ prime_stage_env }}"
      register: r_agent
      changed_when: r_agent.stdout_lines and (r_agent.stdout_lines | last | from_json).changed | default(false)
      check_mode: false
      tags: [agent]

    # ------------------------------------------------------------------ preset
    - name: "stage: preset — warm-boot the web profile to materialize prime-orchestrator"
      ansible.builtin.command:
        cmd: python3 -m prime_stack preset
      environment: "{{ prime_stage_env }}"
      register: r_preset
      changed_when: r_preset.stdout_lines and (r_preset.stdout_lines | last | from_json).changed | default(false)
      check_mode: false
      tags: [preset]

    # ------------------------------------------------------------------ env
    - name: "stage: env — PATH + Cloudflare env bridge in login shells"
      ansible.builtin.command:
        cmd: python3 -m prime_stack env
      environment: "{{ prime_stage_env }}"
      register: r_env
      changed_when: r_env.stdout_lines and (r_env.stdout_lines | last | from_json).changed | default(false)
      check_mode: false
      tags: [env]

    # ------------------------------------------------------------------ dsh-config
    - name: "stage: dsh-config — ~/.dsh/settings.yaml (CF Workers AI default LLM)"
      ansible.builtin.command:
        cmd: python3 -m prime_stack dsh-config
      environment: "{{ prime_stage_env }}"
      register: r_dsh_config
      changed_when: r_dsh_config.stdout_lines and (r_dsh_config.stdout_lines | last | from_json).changed | default(false)
      check_mode: false
      tags: [dsh-config]

    # ------------------------------------------------------------------ prime-config
    - name: "stage: prime-config — ~/.prime/agent/{models,auth,settings}.json (keyed merges)"
      ansible.builtin.command:
        cmd: python3 -m prime_stack prime-config
      environment: "{{ prime_stage_env }}"
      register: r_prime_config
      changed_when: r_prime_config.stdout_lines and (r_prime_config.stdout_lines | last | from_json).changed | default(false)
      check_mode: false
      tags: [prime-config]

    # ------------------------------------------------------------------ extras/plugins
    - name: "stage: extras-plugins — web-profile parity plugins (mnemon, pi2dsh, mobile, mcp-client, agent-memory, restart)"
      ansible.builtin.command:
        cmd: python3 -m prime_stack extras-plugins
      environment: "{{ prime_stage_env }}"
      register: r_extras_plugins
      changed_when: r_extras_plugins.stdout_lines and (r_extras_plugins.stdout_lines | last | from_json).changed | default(false)
      check_mode: false
      tags: [extras, plugins]

    # ------------------------------------------------------------------ extras/mnemon
    - name: "stage: extras-mnemon — mnemon settings + profile patch row (memory in the web UI)"
      ansible.builtin.command:
        cmd: python3 -m prime_stack extras-mnemon
      environment: "{{ prime_stage_env }}"
      register: r_extras_mnemon
      changed_when: r_extras_mnemon.stdout_lines and (r_extras_mnemon.stdout_lines | last | from_json).changed | default(false)
      check_mode: false
      tags: [extras, mnemon]

    # ------------------------------------------------------------------ extras/mobile
    - name: "stage: extras-mobile — dsh-mobile gateway (mobile access, :3443 behind the codespace https origin)"
      ansible.builtin.command:
        cmd: python3 -m prime_stack extras-mobile
      environment: "{{ prime_stage_env }}"
      register: r_extras_mobile
      changed_when: r_extras_mobile.stdout_lines and (r_extras_mobile.stdout_lines | last | from_json).changed | default(false)
      check_mode: false
      tags: [extras, mobile]

    # ------------------------------------------------------------------ extras/mcp
    - name: "stage: extras-mcp — home-level cordis patch (code-review-graph MCP)"
      ansible.builtin.command:
        cmd: python3 -m prime_stack extras-mcp
      environment: "{{ prime_stage_env }}"
      register: r_extras_mcp
      changed_when: r_extras_mcp.stdout_lines and (r_extras_mcp.stdout_lines | last | from_json).changed | default(false)
      check_mode: false
      tags: [extras, mcp]

    # ------------------------------------------------------------------ secrets
    - name: "stage: secrets — Bitwarden vault provision (never fatal)"
      ansible.builtin.command:
        cmd: python3 -m prime_stack secrets
      environment: "{{ prime_stage_env }}"
      register: r_secrets
      changed_when: r_secrets.stdout_lines and (r_secrets.stdout_lines | last | from_json).changed | default(false)
      check_mode: false
      tags: [secrets]

    # ------------------------------------------------------------------ cloudflare
    - name: "stage: cloudflare — wrangler CLI + Cloudflare skills/MCP for dsh, prime-agent, opencode"
      ansible.builtin.command:
        cmd: python3 -m prime_stack cloudflare
      environment: "{{ prime_stage_env }}"
      register: r_cloudflare
      changed_when: r_cloudflare.stdout_lines and (r_cloudflare.stdout_lines | last | from_json).changed | default(false)
      check_mode: false
      tags: [cloudflare]

    # ------------------------------------------------------------------ fleet
    - name: "stage: fleet-presets — specialist agent presets (marker-preserved)"
      ansible.builtin.command:
        cmd: python3 -m prime_stack fleet-presets
      environment: "{{ prime_stage_env }}"
      register: r_fleet_presets
      changed_when: r_fleet_presets.stdout_lines and (r_fleet_presets.stdout_lines | last | from_json).changed | default(false)
      check_mode: false
      tags: [fleet]

    - name: "stage: fleet-patch — wundertrading MCP row + wt-tools cloakDir (web profile patch)"
      ansible.builtin.command:
        cmd: python3 -m prime_stack fleet-patch
      environment: "{{ prime_stage_env }}"
      register: r_fleet_patch
      changed_when: r_fleet_patch.stdout_lines and (r_fleet_patch.stdout_lines | last | from_json).changed | default(false)
      check_mode: false
      tags: [fleet]

    - name: "stage: fleet-autoserve — tvcli multi-account server autostart marker"
      ansible.builtin.command:
        cmd: python3 -m prime_stack fleet-autoserve
      environment: "{{ prime_stage_env }}"
      register: r_fleet_autoserve
      changed_when: r_fleet_autoserve.stdout_lines and (r_fleet_autoserve.stdout_lines | last | from_json).changed | default(false)
      check_mode: false
      tags: [fleet]

    # ------------------------------------------------------------------ stealth-browser
    - name: "stage: stealth-browser — stealth-browser-mcp checkout + venv + dsh MCP row"
      ansible.builtin.command:
        cmd: python3 -m prime_stack stealth-browser
      environment: "{{ prime_stage_env }}"
      register: r_stealth_browser
      changed_when: r_stealth_browser.stdout_lines and (r_stealth_browser.stdout_lines | last | from_json).changed | default(false)
      check_mode: false
      tags: [stealth-browser]

    # ------------------------------------------------------------------ summary
    - name: Prime stack summary
      ansible.builtin.debug:
        msg: "{{ prime_summary_lines }}"
      vars:
        prime_envelopes: >-
            {{ [r_dsh, r_plugin, r_agent, r_preset, r_env, r_dsh_config,
                r_prime_config, r_extras_plugins, r_extras_mnemon, r_extras_mobile,
                r_extras_mcp, r_secrets, r_cloudflare, r_fleet_presets, r_fleet_patch,
                r_fleet_autoserve, r_stealth_browser]
              | selectattr('stdout_lines', 'defined')
              | map(attribute='stdout_lines')
              | map('last')
              | map('from_json')
              | list }}
        prime_summary_lines: >-
          {{ prime_envelopes | map(attribute='summary_line') | list
             + ['grid fleet blueprint: bootstrapping/docs/grid-fleet.md (screen → configure → manage loop)',
                "dsh web autostart: opt-in — 'touch .dsh-autoweb' in the repo root, then restart the codespace",
                'standalone re-run: bootstrapping/python/bin/prime-stack --dry-run all (no ansible needed)'] }}
      tags: [always]
