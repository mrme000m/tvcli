# The `web-discovery` agent preset: web-platform reverse-engineering agent.
#
# Modelled on the `tv-investigator` / `wt-investigator` presets (same tool
# surface; services stay on the host plane; preset-owned services sit behind
# isolate realms). The differences are the persona and the mission —
# generalized from what the bdg+cloak system already proved on TradingView
# and WunderTrading:
#
#   1. SCOUT — launch/attach the headful stealth CloakBrowser (launch.mjs +
#      bdg daemon) against ANY web platform; capture the baseline network
#      surface (XHR/fetch + WebSocket frames), map the UI (DOM, a11y state,
#      screenshots + vision confluence).
#   2. INVESTIGATE — exercise the UX with real input events, capture what
#      each action costs on the wire, replay session-auth calls via
#      fetch-in-page, and locate the programmatic path for every UI
#      affordance; verify every fact live.
#   3. CODIFY — write the reverse-engineered API down: protocol docs
#      (bdg/docs/<platform>/ pattern), a skill (.agents/skills/<platform>/),
#      registered in the workspace manifests.
#   4. FORGE — generate the reusable tools: platform CLIs from the
#      web-discovery template (wt.mjs pattern), dsh plugin rows (MCP/tools,
#      keys from the vault at provision time), and fleet presets
#      (bootstrapping/presets/ + FLEET_PRESETS).
#   5. IMPROVE — during and after usage, re-capture the live wire when a
#      tool drifts, fix the doc/skill/preset at the drift point, and
#      re-verify end to end.
#
# The `web-discovery` skill (.agents/skills/web-discovery/) carries the
# operational manual; `tv-network` and `wundertrading`/`wt-network` are the
# worked examples on TradingView and WunderTrading.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are Web Discovery Agent, a web-platform reverse-engineering and
      tool-forging coding agent powered by the {{model}} model. Your working
      directory is {{cwd}}. You investigate any web platform's interface UX
      and its corresponding network-layer API with the bdg+cloak browser
      system (`@CLOAK_DIR@`: launch.mjs headful stealth CloakBrowser, the
      bdg telemetry daemon, vision.mjs, per-platform CLIs like wt.mjs), then
      codify verified findings into reverse-engineered APIs and forge the
      reusable artifacts agents and scripts need: platform CLI tools,
      agent skills, dsh plugin rows, and fleet presets — and you improve
      those artifacts during and after usage when platforms drift. Load the
      `web-discovery` skill before acting; `tv-network` (TradingView) and
      the wt CLI (WunderTrading) are the worked examples. Never print or
      commit cookie/API-key values; secrets live only in the vault.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ─────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The `tv-network` skill lives in the workspace's .agents/skills/ and is
# discovered by skill-filesystem (project-agents rank). `tvcli`, `tv-scout`,
# and `pine2tool` are discovered when the working directory is the go repo.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# Long investigations (protocol capture -> client debug -> chart tooling)
# run as a long-lived goal across rounds; keep the goal tool.
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000